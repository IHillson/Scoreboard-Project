<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dodgy Dave's — Stock Predictions</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="app">

            <header class="hero">
                <h1 class="brand">
                    <span class="brand-word dodgy">Dodgy</span>

                    <svg class="mascot" viewBox="0 0 120 120" role="img" aria-label="Dodgy Dave, a shifty skull mascot in a captain's hat">
                        <ellipse class="mascot-shadow" cx="60" cy="108" rx="28" ry="6"/>
                        <path class="hat" d="M20 46 C20 30 40 18 60 18 C80 18 100 30 100 46 L104 52 L16 52 Z"/>
                        <circle class="hat-badge" cx="60" cy="34" r="7"/>
                        <path class="skull" d="M60 40 C34 40 24 60 24 76 C24 88 32 96 32 96 L34 88 L42 96 L46 86 L52 96 L60 88 L68 96 L74 86 L78 96 L86 88 L88 96 C88 96 96 88 96 76 C96 60 86 40 60 40 Z"/>
                        <ellipse class="eye" cx="46" cy="70" rx="8" ry="10"/>
                        <ellipse class="eye" cx="74" cy="70" rx="8" ry="10"/>
                        <circle class="pupil" cx="49" cy="72" r="3"/>
                        <circle class="pupil" cx="71" cy="72" r="3"/>
                        <path class="nose" d="M60 78 L55 86 L65 86 Z"/>
                    </svg>

                    <span class="brand-word dave">Dave's</span>
                </h1>
                <p class="tagline">Stock Predictions</p>
            </header>

            <main class="panel">

                <section class="action-panel">
                    <p class="instructions">
                        You must add at least one ticker. A ticker is a 3 letter or more code for a
                        stock. E.g <strong>TSLA</strong> for Tesla.
                    </p>

                    <form id="ticker-input-form" novalidate>
                        <label for="ticker-input">Add a stock ticker</label>
                        <div class="input-row">
                            <input
                                type="text"
                                id="ticker-input"
                                name="ticker-input"
                                placeholder="tsla"
                                autocomplete="off"
                                maxlength="6"
                            >
                            <button type="submit" class="add-ticker-btn" aria-label="Add ticker">
                                <span aria-hidden="true">+</span>
                            </button>
                        </div>
                    </form>

                    <div class="ticker-choice-display" data-empty-text="Your tickers will appear here…"></div>

                    <button type="button" class="generate-report-btn" disabled>Generate Report</button>

                    <p class="odds-note">Always correct 15% of the time!</p>
                </section>

                <section class="loading-panel" aria-live="polite">
                    <div class="spinner" aria-hidden="true"></div>
                    <p id="api-message">Fetching stock data…</p>
                </section>

                <section class="output-panel" aria-live="polite"></section>

            </main>

            <footer class="disclaimer">
                <p>© This is not real financial advice!</p>
            </footer>

        </div>

        <script type="module" src="index.js"></script>
    </body>
</html>
